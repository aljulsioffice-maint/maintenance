<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>بلاغ صيانة</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f5f9; --card: #ffffff; --text: #1b2430; --muted: #6b7686; --line: #dfe4ec;
    --accent: #1f6feb; --accent-soft: #e7f0ff; --ok: #1a7f4b; --ok-soft: #e3f5eb;
    --warn: #b54708; --danger: #c8102e; --danger-soft: #fde8eb; --r: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif; font-size: 17px; line-height: 1.5; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 16px 16px 40px; }
  header { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 14px; }
  header h1 { font-size: 20px; margin: 2px 0 0; font-weight: 800; }
  .office { font-size: 18px; font-weight: 800; color: var(--accent); line-height: 1.3; }
  header { flex-wrap: wrap; gap: 8px; }
  .brand { flex: 1 1 100%; }
  .link-btn { background: none; border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 14px;
    font: inherit; font-size: 15px; color: var(--accent); font-weight: 700; cursor: pointer; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin-bottom: 14px; }
  .card h2 { font-size: 16px; margin: 0 0 12px; color: var(--muted); font-weight: 700; }
  label { display: block; font-weight: 700; margin: 12px 0 6px; font-size: 16px; }
  label:first-of-type { margin-top: 0; }
  input[type=text], input[type=tel], textarea {
    width: 100%; font: inherit; font-size: 18px; padding: 12px 14px; border: 1.5px solid var(--line);
    border-radius: 12px; background: #fbfcfe; color: var(--text); outline: none; }
  input:focus, textarea:focus { border-color: var(--accent); background: #fff; }
  textarea { min-height: 96px; resize: vertical; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row2 label { margin-top: 12px; }
  .types { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .type { border: 1.5px solid var(--line); border-radius: 12px; background: #fbfcfe; padding: 10px 4px;
    text-align: center; cursor: pointer; font: inherit; font-size: 14px; font-weight: 700; color: var(--text); }
  .type .ic { display: block; font-size: 30px; line-height: 1.2; }
  .type.on { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent) inset; }
  .urgent { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 12px; border-radius: 12px;
    border: 1.5px solid var(--line); cursor: pointer; font-weight: 700; }
  .urgent input { width: 22px; height: 22px; accent-color: var(--danger); }
  .urgent small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
  .urgent.on { border-color: var(--danger); background: var(--danger-soft); }
  .media-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mbtn { border: 1.5px dashed var(--accent); border-radius: 12px; background: var(--accent-soft); color: var(--accent);
    padding: 14px 6px; font: inherit; font-weight: 700; cursor: pointer; text-align: center; font-size: 15px; }
  .mbtn .ic { display: block; font-size: 26px; }
  .thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .thumb { position: relative; width: 74px; height: 74px; border-radius: 10px; overflow: hidden; background: #000; }
  .thumb img, .thumb video { width: 100%; height: 100%; object-fit: cover; }
  .thumb button { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; border: 0;
    background: rgba(0,0,0,.65); color: #fff; font-size: 14px; line-height: 24px; padding: 0; cursor: pointer; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .submit { width: 100%; border: 0; border-radius: 14px; background: var(--accent); color: #fff; font: inherit;
    font-size: 20px; font-weight: 800; padding: 16px; cursor: pointer; }
  .submit:disabled { opacity: .6; }
  .err { background: var(--danger-soft); color: var(--danger); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; font-weight: 700; display: none; }
  /* مخفي بلا إزاحة يسار (الإزاحة في صفحة عربية RTL تسبب تمرير أفقي) */
  .hp { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; clip-path: inset(50%); }
  .overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, .55); display: none; align-items: center; justify-content: center; z-index: 9; padding: 16px; }
  .overlay .box { background: #fff; border-radius: 16px; padding: 22px; width: 100%; max-width: 360px; text-align: center; }
  .bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 14px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .done { text-align: center; padding: 26px 16px; }
  .done .big { font-size: 64px; line-height: 1; }
  .done .num { font-size: 34px; font-weight: 800; color: var(--accent); margin: 8px 0; letter-spacing: 1px; }
  .btn2 { display: block; width: 100%; border: 1.5px solid var(--line); background: #fff; border-radius: 14px; padding: 14px;
    font: inherit; font-weight: 700; font-size: 17px; margin-top: 10px; cursor: pointer; color: var(--text); }
  .treq { display: flex; gap: 12px; align-items: flex-start; }
  .treq .ic { font-size: 30px; }
  .treq .t { font-weight: 800; }
  .treq .d { color: var(--muted); font-size: 14px; }
  .steps { display: flex; gap: 4px; margin-top: 10px; }
  .steps span { flex: 1; text-align: center; font-size: 12px; padding: 6px 2px; border-radius: 8px; background: #eef1f6; color: var(--muted); font-weight: 700; }
  .steps span.on { background: var(--accent-soft); color: var(--accent); }
  .steps span.ok { background: var(--ok-soft); color: var(--ok); }
  .box { border-radius: 12px; padding: 10px 12px; margin-top: 10px; font-size: 15px; }
  .box.rej { background: var(--danger-soft); color: var(--danger); }
  .box.live { background: var(--ok-soft); color: var(--ok); }
  .box.live.way { background: #fff3cd; color: #7a4b00; }
  .box.ask { background: #efe9fb; color: #3b2a73; }
  .box.ask textarea { margin-top: 8px; min-height: 70px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand"><div class="office">مكتب عبد الله الجلسي للعقارات</div><h1>🔧 بلاغ صيانة</h1></div>
    <button class="link-btn hidden" id="myBtn" onclick="showTrack()">📋 طلباتي</button>
    <a class="link-btn" id="waBtn" target="_blank" rel="noopener" style="text-decoration:none">💬 واتساب المكتب</a>
  </header>

  <!-- ===== النموذج ===== -->
  <div id="formView">
    <div class="err" id="err"></div>

    <div class="card">
      <h2>بيانات المستأجر</h2>
      <label for="name">اسم المستأجر (الاسم الأول والأخير)</label>
      <input type="text" id="name" autocomplete="name" placeholder="مثال: فهد العتيبي">
      <div class="row2">
        <div><label for="district">الحي</label><input type="text" id="district" placeholder="مثال: النسيم"></div>
        <div><label for="apt">رقم الشقة</label><input type="text" id="apt" inputmode="numeric" placeholder="12"></div>
      </div>
      <label for="phone">جوال للتواصل</label>
      <input type="tel" id="phone" inputmode="tel" autocomplete="tel" placeholder="05xxxxxxxx" dir="ltr" style="text-align:right">
    </div>

    <div class="card">
      <h2>المشكلة</h2>
      <div class="types" id="types"></div>
      <label class="urgent" id="urgentBox">
        <input type="checkbox" id="urgent" onchange="this.parentNode.classList.toggle('on', this.checked)">
        <span>🔴 طارئ<small>تسريب ماء، انقطاع كهرباء، مصعد معطّل…</small></span>
      </label>
      <label for="desc">وصف المشكلة</label>
      <textarea id="desc" placeholder="اكتب المشكلة باختصار…"></textarea>
    </div>

    <div class="card">
      <h2>صور أو فيديو (اختياري)</h2>
      <div class="media-btns">
        <button class="mbtn" type="button" onclick="document.getElementById('photoCam').click()"><span class="ic">📷</span>تصوير صورة الآن</button>
        <button class="mbtn" type="button" onclick="document.getElementById('photoIn').click()"><span class="ic">🖼️</span>صورة من الاستوديو</button>
        <button class="mbtn" type="button" onclick="document.getElementById('videoCam').click()"><span class="ic">🎥</span>تصوير فيديو الآن</button>
        <button class="mbtn" type="button" onclick="document.getElementById('videoIn').click()"><span class="ic">🎞️</span>فيديو من الاستوديو</button>
      </div>
      <input type="file" id="photoCam" accept="image/*" capture="environment" class="hidden">
      <input type="file" id="photoIn" accept="image/*" multiple class="hidden">
      <input type="file" id="videoCam" accept="video/*" capture="environment" class="hidden">
      <input type="file" id="videoIn" accept="video/*" class="hidden">
      <div class="thumbs" id="thumbs"></div>
      <div class="hint">حتى 4 صور، وفيديو واحد لا يزيد عن 30 ثانية.</div>
    </div>

    <div class="hp" aria-hidden="true"><input type="text" id="website" tabindex="-1" autocomplete="off"></div>
    <button class="submit" id="sendBtn" onclick="send()">إرسال البلاغ</button>
  </div>

  <!-- ===== تم الإرسال ===== -->
  <div id="doneView" class="hidden">
    <div class="card done">
      <div class="big">✅</div>
      <div style="font-size:20px;font-weight:800;margin-top:10px">تم استلام بلاغك</div>
      <div class="num" id="doneNum"></div>
      <div style="color:var(--muted)">سيتواصل معك فريق الصيانة قريباً</div>
      <div class="hint" id="doneWarn" style="color:var(--warn)"></div>
    </div>
    <a class="btn2" id="tgBtn" target="_blank" rel="noopener" style="text-decoration:none;text-align:center;background:#e8f4fd;border-color:#9ccaf0;color:#0b5a8c">🔔 وصّل لي التحديثات على تليجرام (تلقائي)</a>
    <button class="btn2" onclick="showTrack()">📋 متابعة حالة طلباتي</button>
    <button class="btn2" onclick="shareLink()">🔗 احفظ رابط المتابعة (واتساب)</button>
    <button class="btn2" onclick="newRequest()">➕ بلاغ جديد</button>
  </div>

  <!-- ===== طلباتي ===== -->
  <div id="trackView" class="hidden">
    <div id="trackList"></div>
    <button class="btn2" onclick="newRequest()">➕ بلاغ جديد</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="box">
    <div style="font-size:40px">📤</div>
    <div style="font-weight:800;font-size:18px" id="ovText">جاري الإرسال…</div>
    <div class="bar"><i id="ovBar"></i></div>
    <div class="hint">لا تغلق الصفحة</div>
  </div>
</div>

<script>
  // /*CONFIG*/ — نسخة GitHub Pages تستبدل هذا السطر بقيمها (انظر build_page.py)
  const _q = new URLSearchParams(location.search);
  const TRACK = (_q.get('t') || '').replace(/[^a-f0-9]/g, '').slice(0, 20), APP_URL = location.origin + location.pathname, API_URL = 'https://script.google.com/macros/s/AKfycby4tmfamJKcw5g29sgp45Rp6j_jSC_1TB5a28VDDbqjznHfN8aZFDdc8Bn9pcWkLs6u7g/exec';
  const TYPES = [['plumb','🚿','سباكة'],['elec','⚡','كهرباء'],['elev','🛗','مصعد'],['other','🛠️','أخرى']];
  const BOT_USER = 'Aljulsi_maint_bot';   // بوت تليجرام: ربط المستأجر بتحديثات طلبه
  const OFFICE_WA = '966572294942';   // رقم واتساب المكتب (يظهر في زر «واتساب المكتب»)
  const MAX_PHOTOS = 4, MAX_VIDEO_SEC = 30, MAX_VIDEO_MB = 45, CHUNK = 4 * 1024 * 1024; // مضاعف 256KB (شرط Drive)
  let selType = '', photos = [], video = null, lastToken = '';

  // ---------- تخزين محلي (قد يكون محظوراً بالمتصفح: كل شيء داخل try) ----------
  function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  // داخل Google: google.script.run — خارجها (GitHub Pages): fetch لنفس الدوال، بلا حساب Google (credentials: omit)
  function apiPost(fn, args, keepalive) {
    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: fn, args: args }), credentials: 'omit', redirect: 'follow', keepalive: !!keepalive });
  }
  function run(fn, ...args) {
    if (!API_URL) return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
    return apiPost(fn, args).then(r => r.json()).then(j => { if (!j.ok) throw new Error(j.error); return j.result; });
  }
  // بلا انتظار: يكمل في الخادم حتى لو أُغلقت الصفحة
  function fire(fn, ...args) {
    try { if (!API_URL) google.script.run[fn](...args); else apiPost(fn, args, true).catch(() => {}); } catch (e) {}
  }
  const $ = id => document.getElementById(id);

  // ---------- بناء الصفحة ----------
  $('types').innerHTML = TYPES.map(t => `<button type="button" class="type" data-k="${t[0]}"><span class="ic">${t[1]}</span>${t[2]}</button>`).join('');
  $('types').addEventListener('click', e => {
    const b = e.target.closest('.type'); if (!b) return;
    selType = b.dataset.k;
    document.querySelectorAll('.type').forEach(x => x.classList.toggle('on', x === b));
  });
  $('waBtn').href = 'https://wa.me/' + OFFICE_WA;
  const prof = lsGet('mr_profile', {});
  ['name', 'district', 'apt', 'phone'].forEach(k => { if (prof[k]) $(k).value = prof[k]; });
  refreshMyBtn();
  if (TRACK) { const t = lsGet('mr_tokens', []); if (t.indexOf(TRACK) < 0) { t.push(TRACK); lsSet('mr_tokens', t); } showTrack(); }

  function refreshMyBtn() { $('myBtn').classList.toggle('hidden', !lsGet('mr_tokens', []).length && !TRACK); }

  // ---------- الوسائط ----------
  ['photoIn', 'photoCam'].forEach(id => $(id).addEventListener('change', e => {
    const files = Array.from(e.target.files || []);
    for (const f of files) {
      if (photos.length >= MAX_PHOTOS) { showErr('الحد ' + MAX_PHOTOS + ' صور'); break; }
      photos.push({ file: f, url: URL.createObjectURL(f) });
    }
    e.target.value = ''; drawThumbs();
  }));
  ['videoIn', 'videoCam'].forEach(id => $(id).addEventListener('change', async e => {
    const f = e.target.files && e.target.files[0]; e.target.value = '';
    if (!f) return;
    const dur = await videoDuration(f);
    if (dur > MAX_VIDEO_SEC + 1) return showErr('الفيديو أطول من ' + MAX_VIDEO_SEC + ' ثانية — صوّر مقطعاً أقصر');
    if (f.size > MAX_VIDEO_MB * 1024 * 1024) return showErr('حجم الفيديو كبير — صوّر مقطعاً أقصر');
    video = { file: f, url: URL.createObjectURL(f) }; drawThumbs();
  }));
  function videoDuration(file) {
    return new Promise(res => {
      const v = document.createElement('video'); v.preload = 'metadata';
      v.onloadedmetadata = () => { res(v.duration || 0); URL.revokeObjectURL(v.src); };
      v.onerror = () => res(0); v.src = URL.createObjectURL(file);
    });
  }
  function drawThumbs() {
    const h = photos.map((p, i) => `<div class="thumb"><img src="${p.url}"><button onclick="rmPhoto(${i})">✕</button></div>`);
    if (video) h.push(`<div class="thumb"><video src="${video.url}" muted></video><button onclick="rmVideo()">✕</button></div>`);
    $('thumbs').innerHTML = h.join('');
  }
  function rmPhoto(i) { photos.splice(i, 1); drawThumbs(); }
  function rmVideo() { video = null; drawThumbs(); }

  async function compress(file) {
    const url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const s = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    return c.toDataURL('image/jpeg', 0.7).split(',')[1];
  }
  function blobToB64(blob) {
    return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); });
  }

  // ---------- الإرسال ----------
  function showErr(m) { const e = $('err'); e.textContent = m; e.style.display = m ? 'block' : 'none'; if (m) window.scrollTo({ top: 0, behavior: 'smooth' }); }
  function progress(text, pct) { $('ovText').textContent = text; $('ovBar').style.width = Math.round(pct) + '%'; }

  async function send() {
    showErr('');
    const f = {
      name: $('name').value.trim(), district: $('district').value.trim(), apt: $('apt').value.trim(),
      phone: $('phone').value.trim(), desc: $('desc').value.trim(), type: selType, urgent: $('urgent').checked,
      website: $('website').value, mediaCount: photos.length + (video ? 1 : 0),
    };
    if (f.name.length < 2) return showErr('اكتب اسم المستأجر');
    if (!f.district) return showErr('اكتب الحي');
    if (!f.apt) return showErr('اكتب رقم الشقة');
    if (!/^(05|5|\+9665|9665|009665)\d{8}$/.test(f.phone.replace(/[\s-]/g, '').replace(/[٠-٩]/g, d => d.charCodeAt(0) - 1632))) return showErr('رقم الجوال غير صحيح (مثال: 0551234567)');
    if (!f.type) return showErr('اختر نوع المشكلة');
    if (f.desc.length < 3 && !f.mediaCount) return showErr('اكتب وصف المشكلة أو أرفق صورة');

    $('sendBtn').disabled = true; $('overlay').style.display = 'flex'; progress('جاري الإرسال…', 5);
    let res;
    try { res = await run('submitRequest', f); }
    catch (e) { return endSend('تعذر الإرسال، تأكد من الإنترنت وحاول مرة ثانية'); }
    if (!res || !res.ok) return endSend(res && res.msg ? res.msg : 'تعذر الإرسال');
    lsSet('mr_profile', { name: f.name, district: f.district, apt: f.apt, phone: f.phone });

    // رقم البلاغ يظهر فوراً؛ المرفقات تكمل رفعها بالخلفية وتظهر حالتها بشاشة «تم الاستلام»
    const ph = photos.slice(), vd = video;
    if (res.id) { const t = lsGet('mr_tokens', []); t.push(res.token); lsSet('mr_tokens', t); }
    lastToken = res.token;
    $('tgBtn').href = 'https://t.me/' + BOT_USER + '?start=t_' + res.token;
    $('overlay').style.display = 'none'; $('sendBtn').disabled = false;
    $('doneNum').textContent = '#' + res.id;
    const hasMedia = !!(res.id && (ph.length || vd));
    $('doneWarn').textContent = hasMedia ? '⏳ جاري رفع المرفقات… لا تغلق الصفحة حتى تظهر «تم رفع المرفقات»' : '';
    photos = []; video = null; drawThumbs(); $('desc').value = ''; $('urgent').checked = false;
    $('urgentBox').classList.remove('on'); selType = ''; document.querySelectorAll('.type').forEach(x => x.classList.remove('on'));
    show('doneView'); refreshMyBtn();
    if (!hasMedia) return;

    let failed = 0, uploading = true;
    const guard = e => { if (uploading) { e.preventDefault(); e.returnValue = ''; } };
    window.addEventListener('beforeunload', guard);
    const total = ph.length + (vd ? Math.max(1, Math.ceil(vd.file.size / CHUNK)) : 0);
    let step = 0;
    const bump = () => { $('doneWarn').textContent = '⏳ جاري رفع المرفقات (' + Math.min(100, Math.round(100 * (++step) / Math.max(1, total))) + '%)… لا تغلق الصفحة'; };
    // الصور كلها والفيديو بنفس الوقت (لا واحد بعد الثاني) — هذا أكبر توفير في الوقت
    const photoJobs = ph.map(async p => {
      try { const r = await run('uploadPhoto', res.id, res.token, await compress(p.file)); if (!r || !r.ok) failed++; }
      catch (e) { failed++; }
      bump();
    });
    const videoJob = (async () => {
      if (!vd) return;
      try {
        const st = await run('startVideo', res.id, res.token, vd.file.size, vd.file.type);
        if (!st.ok) throw new Error(st.msg);
        for (let off = 0; off < vd.file.size; off += CHUNK) {
          const b64 = await blobToB64(vd.file.slice(off, off + CHUNK));
          await run('uploadVideoChunk', st.key, off, b64);
          bump();
        }
        await run('finishVideo', res.id, res.token, st.key);
      } catch (e) { failed++; }
    })();
    await Promise.all(photoJobs.concat([videoJob]));
    uploading = false; window.removeEventListener('beforeunload', guard);
    // الإرسال لتليجرام يكمل في الخلفية — المستأجر لا ينتظره
    fire('flushMedia', res.id, res.token);
    $('doneWarn').textContent = failed ? 'تعذر رفع بعض المرفقات — البلاغ نفسه وصل.' : '✅ تم رفع المرفقات';
  }
  function endSend(msg) { $('overlay').style.display = 'none'; $('sendBtn').disabled = false; showErr(msg); }

  function show(id) { ['formView', 'doneView', 'trackView'].forEach(v => $(v).classList.toggle('hidden', v !== id)); window.scrollTo(0, 0); }
  function newRequest() { show('formView'); }
  function shareLink() {
    const url = APP_URL + '?t=' + lastToken;
    window.open('https://wa.me/?text=' + encodeURIComponent('رابط متابعة بلاغ الصيانة: ' + url), '_blank');
  }

  // ---------- طلباتي ----------
  let uploadingMore = false;
  async function showTrack(quiet) {
    if (quiet && uploadingMore) return;
    if (!quiet) show('trackView');
    const tokens = lsGet('mr_tokens', []);
    if (TRACK && tokens.indexOf(TRACK) < 0) tokens.push(TRACK);
    if (!tokens.length) { $('trackList').innerHTML = '<div class="card">لا توجد طلبات محفوظة في هذا الجوال.</div>'; return; }
    if (!quiet) $('trackList').innerHTML = '<div class="card">جاري التحميل…</div>';
    let list = [];
    try { list = await run('getTracking', tokens); } catch (e) { if (!quiet) $('trackList').innerHTML = '<div class="card">تعذر التحميل، حاول لاحقاً.</div>'; return; }
    if (!list.length) { $('trackList').innerHTML = '<div class="card">لا توجد طلبات.</div>'; return; }
    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    $('trackList').innerHTML = list.map(r => {
      const labels = ['جديد', 'قيد المعالجة', 'تمت المعالجة'];
      const steps = r.status === 'مرفوض' ? '' : '<div class="steps">' + labels.map((s, i) =>
        `<span class="${r.step > i + 1 || r.step === 3 ? 'ok' : r.step === i + 1 ? 'on' : ''}">${s}</span>`).join('') + '</div>';
      const rej = r.status === 'مرفوض' ? `<div class="box rej"><b>🚫 تعذّر تنفيذ الطلب</b>${r.reason ? '<div>السبب: ' + esc(r.reason) + '</div>' : ''}</div>` : '';
      const askMedia = r.status === 'بانتظار ردك' && r.media ? `<div class="box ask"><b>📷 الإدارة تطلب صورة أو فيديو:</b><div>${esc(r.question)}</div>
        <input type="file" id="mf${esc(r.id)}" accept="image/*,video/*" multiple class="hidden" onchange="sendMore('${esc(r.id)}','${esc(r.token)}')">
        <button class="submit" style="font-size:17px;padding:12px;margin-top:8px" onclick="document.getElementById('mf${esc(r.id)}').click()">📷 اختر صورة أو فيديو</button>
        <div class="hint" id="ms${esc(r.id)}"></div></div>` : '';
      const ask = askMedia || (r.status === 'بانتظار ردك' ? `<div class="box ask"><b>❓ الإدارة تسأل:</b><div>${esc(r.question)}</div>
        <textarea id="rp${esc(r.id)}" placeholder="اكتب ردك هنا…"></textarea>
        <button class="submit" style="font-size:17px;padding:12px;margin-top:8px" onclick="sendReply('${esc(r.id)}','${esc(r.token)}')">إرسال الرد</button></div>` : '');
      const live = r.ts === 'way' ? `<div class="box live way">🚗 الفني ${esc(r.tech)} <b>في الطريق إليك الآن</b></div>`
        : r.ts === 'work' ? `<div class="box live">🔧 الفني ${esc(r.tech)} <b>يعمل على طلبك</b></div>`
        : r.ts === 'assigned' ? `<div class="box live">👷 تم تعيين الفني ${esc(r.tech)} لطلبك</div>`
        : r.ts === 'done' ? `<div class="box live">✔️ أنهى الفني ${esc(r.tech)} العمل، ونتأكد من الإنجاز</div>` : '';
      const tg = !r.linked && r.status !== 'مرفوض' && r.status !== 'تمت المعالجة'
        ? `<a class="hint" target="_blank" rel="noopener" style="display:block;margin-top:8px;color:#0b5a8c;font-weight:700" href="https://t.me/${BOT_USER}?start=t_${esc(r.token)}">🔔 وصّل لي تحديثات هذا الطلب على تليجرام</a>` : '';
      const note = r.status === 'تمت المعالجة' && r.note ? `<div class="hint">ملاحظة: ${esc(r.note)}</div>` : '';
      const when = r.closed ? (r.status === 'مرفوض' ? ' · ' : ' · أُنجز ') + esc(r.closed) : '';
      return `<div class="card"><div class="treq"><div class="ic">${esc(r.icon)}</div><div style="flex:1">
        <div class="t">طلب #${esc(r.id)} — ${esc(r.type)}</div><div class="d">${esc(r.date)}${when}</div>
        ${steps}${live}${rej}${ask}${note}${tg}</div></div></div>`;
    }).join('');
  }
  // تحديث تلقائي كل 20 ثانية والمستأجر فاتح «طلباتي» (لا نمسح ما يكتبه برد معلّق)
  setInterval(() => {
    try {
      if ($('trackView').classList.contains('hidden') || document.hidden || uploadingMore) return;
      if ([...document.querySelectorAll('#trackList textarea')].some(t => t.value.trim() || document.activeElement === t)) return;
      showTrack(true);
    } catch (e) {}
  }, 20000);
  // الإدارة طلبت صورة/فيديو: يرفعها المستأجر من «طلباتي»
  async function sendMore(id, token) {
    const files = [...$('mf' + id).files], st = $('ms' + id);
    if (!files.length) return;
    const pics = files.filter(f => /^image\//.test(f.type)).slice(0, MAX_PHOTOS), vid = files.find(f => /^video\//.test(f.type));
    const total = pics.length + (vid ? 1 : 0);
    if (!total) { st.textContent = 'اختر صورة أو فيديو'; return; }
    uploadingMore = true;
    const guard = e => { e.preventDefault(); e.returnValue = ''; };
    window.addEventListener('beforeunload', guard);
    let failed = 0, n = 0;
    const upd = () => { st.textContent = '⏳ جاري الرفع (' + n + '/' + total + ')… لا تغلق الصفحة'; }; upd();
    const jobs = pics.map(async f => {
      try { const r = await run('uploadPhoto', id, token, await compress(f)); if (!r || !r.ok) failed++; } catch (e) { failed++; }
      n++; upd();
    });
    jobs.push((async () => {
      if (!vid) return;
      try {
        if (vid.size > MAX_VIDEO_MB * 1024 * 1024) throw new Error('big');
        const s = await run('startVideo', id, token, vid.size, vid.type);
        if (!s.ok) throw new Error(s.msg);
        for (let off = 0; off < vid.size; off += CHUNK) await run('uploadVideoChunk', s.key, off, await blobToB64(vid.slice(off, off + CHUNK)));
        await run('finishVideo', id, token, s.key);
      } catch (e) { failed++; }
      n++; upd();
    })());
    await Promise.all(jobs);
    window.removeEventListener('beforeunload', guard);
    if (failed >= total) { uploadingMore = false; st.textContent = 'تعذر الرفع (قد يكون الفيديو كبيراً)، حاول مرة ثانية'; return; }
    try { await run('mediaDone', id, token); } catch (e) { /* */ }
    fire('flushMedia', id, token);
    uploadingMore = false;
    showTrack();
  }
  async function sendReply(id, token) {
    const ta = $('rp' + id), text = (ta.value || '').trim();
    if (text.length < 2) { ta.focus(); return; }
    ta.disabled = true;
    try { const r = await run('replyInfo', id, token, text); if (!r || !r.ok) { alert(r && r.msg ? r.msg : 'تعذر الإرسال'); ta.disabled = false; return; } }
    catch (e) { alert('تعذر الإرسال، حاول مرة ثانية'); ta.disabled = false; return; }
    showTrack();
  }
</script>
