<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f4c81">
<title>لوحة الصيانة</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef2f7; --card: #ffffff; --tx: #17202e; --mut: #667489; --bd: #e2e8f0; --soft: #f5f7fb;
    --brand: #0f4c81; --pri: #1f6fe0; --pri-soft: #e7f0ff;
    --ok: #138a55; --ok-soft: #dff5ea; --warn: #a15c00; --warn-soft: #fff1d4; --bad: #c62828; --bad-soft: #fde8e8;
    --new: #1f6fe0; --new-soft: #e7f0ff; --ask: #6b46c1; --ask-soft: #efe9fb; --wait: #c2570c; --wait-soft: #ffeadb;
    --bar: #5b95ee; --bar2: #c9daf6; --shadow: 0 1px 2px rgba(15,37,64,.05), 0 8px 24px rgba(15,37,64,.06); --r: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c121a; --card: #141d29; --tx: #e8eef6; --mut: #90a1b5; --bd: #243246; --soft: #0f1823;
      --brand: #0b3a63; --pri: #6aa2ff; --pri-soft: #17294a;
      --ok: #52d396; --ok-soft: #12301f; --warn: #f1c35a; --warn-soft: #382c0e; --bad: #ff8d8d; --bad-soft: #3b1a1a;
      --new: #6aa2ff; --new-soft: #17294a; --ask: #b9a2ff; --ask-soft: #2a2145; --wait: #ffb27a; --wait-soft: #3a2412;
      --bar: #3d72c9; --bar2: #25365a; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c121a; --card: #141d29; --tx: #e8eef6; --mut: #90a1b5; --bd: #243246; --soft: #0f1823;
    --brand: #0b3a63; --pri: #6aa2ff; --pri-soft: #17294a;
    --ok: #52d396; --ok-soft: #12301f; --warn: #f1c35a; --warn-soft: #382c0e; --bad: #ff8d8d; --bad-soft: #3b1a1a;
    --new: #6aa2ff; --new-soft: #17294a; --ask: #b9a2ff; --ask-soft: #2a2145; --wait: #ffb27a; --wait-soft: #3a2412;
    --bar: #3d72c9; --bar2: #25365a; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--tx); font-family: 'Tajawal', 'Segoe UI', Tahoma, system-ui, sans-serif; font-size: 15.5px; line-height: 1.5; }
  button { font: inherit; cursor: pointer; }
  a { color: inherit; }
  .hidden { display: none !important; }

  /* ===== الإطار: قائمة جانبية (حاسوب) / شريط سفلي (جوال) ===== */
  .side { position: fixed; inset-block: 0; inset-inline-start: 0; width: 230px; background: linear-gradient(180deg, var(--brand), #0a2f52); color: #fff; display: flex; flex-direction: column; padding: 18px 12px; z-index: 6; }
  .side .brandrow { display: flex; align-items: center; gap: 10px; padding: 6px 8px 18px; }
  .side .logo { width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,.16); display: grid; place-items: center; font-size: 22px; }
  .side .bt { font-weight: 800; line-height: 1.25; font-size: 16px; }
  .side .bt small { display: block; font-weight: 500; opacity: .75; font-size: 12.5px; }
  .nav { display: flex; flex-direction: column; gap: 4px; }
  .tab { display: flex; align-items: center; gap: 11px; border: 0; background: transparent; color: rgba(255,255,255,.78); padding: 12px 14px; border-radius: 12px; font-weight: 700; text-align: start; width: 100%; }
  .tab .ico { font-size: 19px; width: 24px; text-align: center; }
  .tab:hover { background: rgba(255,255,255,.08); }
  .tab.on { background: rgba(255,255,255,.18); color: #fff; }
  .tab .cnt { margin-inline-start: auto; background: var(--bad); color: #fff; border-radius: 99px; font-size: 12px; padding: 1px 8px; font-weight: 800; }
  .side .foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .side .me { opacity: .85; padding: 0 8px; }
  .side .row2 { display: flex; gap: 6px; }
  .ib { flex: 1; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); color: #fff; border-radius: 10px; padding: 8px 6px; font-size: 14px; }
  main { margin-inline-start: 230px; min-height: 100vh; }
  .topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 12px 22px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--bd); }
  .topbar h1 { font-size: 20px; margin: 0; font-weight: 800; flex: 1; }
  .topbar .upd { color: var(--mut); font-size: 13px; }
  .topbar .ib { flex: none; width: 40px; padding: 8px 0; background: var(--card); border-color: var(--bd); color: var(--tx); }
  .mob { display: none; }
  @media (max-width: 900px) {
    .side { inset-block: auto 0; inset-inline: 0; width: auto; flex-direction: row; padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); background: var(--brand); border-top: 1px solid rgba(255,255,255,.15); }
    .side .brandrow, .side .foot { display: none; }
    .nav { flex-direction: row; width: 100%; gap: 2px; }
    .tab { flex-direction: column; gap: 2px; padding: 7px 2px; font-size: 11.5px; text-align: center; justify-content: center; position: relative; }
    .tab .cnt { position: absolute; top: 2px; inset-inline-start: 50%; margin: 0; transform: translateX(-30%); font-size: 10.5px; padding: 0 6px; }
    main { margin-inline-start: 0; padding-bottom: 76px; }
    .topbar { padding: 10px 14px; }
    .topbar h1 { font-size: 17px; }
    .mob { display: flex; gap: 6px; }
  }

  /* ===== عام ===== */
  .page { padding: 18px 22px 40px; max-width: 1180px; margin: 0 auto; }
  @media (max-width: 900px) { .page { padding: 14px 14px 30px; } }
  .card, .panel { background: var(--card); border: 1px solid var(--bd); border-radius: var(--r); box-shadow: var(--shadow); }
  .panel { padding: 18px; }
  .btn { border: 1px solid var(--bd); background: var(--card); color: var(--tx); border-radius: 12px; padding: 9px 14px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14.5px; transition: background .15s, border-color .15s; }
  .btn:hover { border-color: var(--pri); }
  .btn.pri { background: var(--pri); color: #fff; border-color: var(--pri); }
  .btn.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
  .btn.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
  .btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 10px; }
  select, .inp { border: 1.5px solid var(--bd); background: var(--soft); color: var(--tx); border-radius: 12px; padding: 9px 11px; font: inherit; outline: none; }
  select:focus, .inp:focus, textarea:focus { border-color: var(--pri); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; align-items: center; }
  h3 { font-size: 13.5px; color: var(--mut); margin: 20px 0 8px; font-weight: 800; letter-spacing: .2px; }
  .empty { text-align: center; color: var(--mut); padding: 44px 10px; }
  .skel { height: 66px; border-radius: 14px; margin-bottom: 8px; background: linear-gradient(90deg, var(--soft), var(--bd), var(--soft)); background-size: 200% 100%; animation: sk 1.2s infinite; }
  @keyframes sk { to { background-position: -200% 0; } }
  .badge { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 12.5px; font-weight: 800; }
  .b-جديد { background: var(--new-soft); color: var(--new); }
  .b-قيد { background: var(--warn-soft); color: var(--warn); }
  .b-أنجزه { background: var(--wait-soft); color: var(--wait); }
  .b-تمت { background: var(--ok-soft); color: var(--ok); }
  .b-مرفوض { background: var(--bad-soft); color: var(--bad); }
  .b-بانتظار { background: var(--ask-soft); color: var(--ask); }
  .urg { color: var(--bad); font-weight: 800; }

  /* ===== الطلبات ===== */
  .sumline { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .kpi { flex: 1 1 140px; background: var(--card); border: 1px solid var(--bd); border-radius: var(--r); padding: 14px 16px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
  .kpi::before { content: ''; position: absolute; inset-inline-start: 0; top: 0; bottom: 0; width: 5px; background: var(--c, var(--pri)); }
  .kpi b { display: block; font-size: 28px; line-height: 1.1; font-weight: 800; }
  .kpi span { color: var(--mut); font-size: 13.5px; font-weight: 700; }
  .kpi.red b { color: var(--bad); }
  .chipsbar { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; }
  .chipsbar::-webkit-scrollbar { display: none; }
  .fchip { flex: none; border: 1.5px solid var(--bd); background: var(--card); color: var(--tx); border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 14px; display: inline-flex; gap: 7px; align-items: center; }
  .fchip b { background: var(--soft); border-radius: 99px; padding: 0 8px; font-size: 12.5px; }
  .fchip.on { background: var(--pri); border-color: var(--pri); color: #fff; }
  .fchip.on b { background: rgba(255,255,255,.25); }
  .fchip.red b { background: var(--bad-soft); color: var(--bad); }
  .wrap { display: grid; grid-template-columns: minmax(340px, 470px) 1fr; gap: 16px; align-items: start; }
  @media (max-width: 1000px) { .wrap { grid-template-columns: 1fr; } #detail { display: none; } body.showd #list, body.showd .sumline, body.showd .chipsbar { display: none; } body.showd #detail { display: block; } }
  .tools { display: flex; gap: 8px; margin-bottom: 10px; }
  .tools input { flex: 1; min-width: 0; border: 1.5px solid var(--bd); background: var(--card); color: var(--tx); border-radius: 14px; padding: 11px 14px; font: inherit; outline: none; box-shadow: var(--shadow); }
  .tools input:focus { border-color: var(--pri); }
  .item { position: relative; background: var(--card); border: 1.5px solid var(--bd); border-radius: 16px; padding: 12px 14px 12px 12px; margin-bottom: 10px; cursor: pointer; display: grid; grid-template-columns: 46px 1fr auto; gap: 2px 12px; align-items: center; box-shadow: var(--shadow); transition: transform .12s, border-color .15s; }
  .item::before { content: ''; position: absolute; inset-inline-start: 0; top: 12px; bottom: 12px; width: 4px; border-radius: 4px; background: var(--sc, var(--bd)); }
  .item:hover { border-color: var(--pri); transform: translateY(-1px); }
  .item.sel { border-color: var(--pri); background: var(--pri-soft); }
  .item .av { grid-row: span 3; width: 46px; height: 46px; border-radius: 14px; background: var(--soft); display: grid; place-items: center; font-size: 24px; }
  .item .t { font-weight: 800; font-size: 16px; }
  .item .s { color: var(--mut); font-size: 13.5px; }
  .item .m { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 2px; }
  .item .r { grid-row: span 3; text-align: end; font-size: 12.5px; color: var(--mut); align-self: start; white-space: nowrap; }
  .s-جديد { --sc: var(--new); } .s-قيد { --sc: #e8a317; } .s-أنجزه { --sc: var(--wait); } .s-تمت { --sc: var(--ok); } .s-مرفوض { --sc: var(--bad); } .s-بانتظار { --sc: var(--ask); }
  #detail { position: sticky; top: 76px; max-height: calc(100vh - 96px); overflow: auto; padding: 0; }
  #detail .dh { padding: 18px 20px 14px; background: linear-gradient(135deg, var(--pri-soft), transparent); border-bottom: 1px solid var(--bd); border-radius: var(--r) var(--r) 0 0; }
  #detail .dh h2 { margin: 0 0 6px; font-size: 21px; font-weight: 800; }
  #detail .db { padding: 6px 20px 22px; }
  .kv { display: grid; grid-template-columns: 96px 1fr; gap: 8px 12px; margin: 14px 0; background: var(--soft); border-radius: 14px; padding: 14px; }
  .kv div:nth-child(odd) { color: var(--mut); font-weight: 700; font-size: 14px; }
  .desc { background: var(--soft); border-radius: 14px; padding: 12px 14px; white-space: pre-wrap; line-height: 1.7; }
  .log { font-size: 13.5px; border-inline-start: 2px solid var(--bd); padding-inline-start: 14px; margin-inline-start: 4px; }
  .log > div { margin-bottom: 10px; position: relative; }
  .log > div::before { content: ''; position: absolute; inset-inline-start: -20px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--pri); }
  .log small { color: var(--mut); display: block; }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
  .thumbs .th { aspect-ratio: 1; border-radius: 12px; background: var(--soft); border: 1px solid var(--bd); overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--mut); text-align: center; cursor: pointer; }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; }
  .back { display: none; margin: 12px 14px 0; }
  @media (max-width: 1000px) { .back { display: inline-flex; } #detail { position: static; max-height: none; } }

  /* ===== النوافذ ===== */
  .modal { position: fixed; inset: 0; background: rgba(8,16,28,.62); backdrop-filter: blur(3px); display: none; align-items: center; justify-content: center; z-index: 30; padding: 16px; }
  .modal.on { display: flex; }
  .modal .box { background: var(--card); border-radius: 20px; padding: 20px; width: min(480px, 100%); max-height: 92vh; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  .modal label { display: block; color: var(--mut); font-size: 13.5px; font-weight: 700; margin: 12px 0 5px; }
  .modal .inp, .modal textarea { width: 100%; }
  .modal textarea { min-height: 96px; border: 1.5px solid var(--bd); background: var(--soft); color: var(--tx); border-radius: 12px; padding: 10px; font: inherit; outline: none; }
  #lb img { max-width: 96vw; max-height: 90vh; border-radius: 14px; }
  .toast { position: fixed; bottom: 22px; inset-inline: 0; margin: auto; width: fit-content; max-width: 92vw; background: #1b2635; color: #fff; padding: 11px 20px; border-radius: 14px; display: none; z-index: 40; box-shadow: 0 10px 30px rgba(0,0,0,.35); font-weight: 700; }
  .toast.on { display: block; animation: up .25s; }
  @keyframes up { from { transform: translateY(12px); opacity: 0; } }
  @media (max-width: 900px) { .toast { bottom: 84px; } }
  #gate { max-width: 420px; margin: 70px auto; padding: 0 20px; text-align: center; }
  #gate .gi { font-size: 56px; }

  /* ===== الإحصاءات والجداول ===== */
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 16px; margin-top: 16px; }
  .panel > b:first-child { display: block; font-size: 16px; margin-bottom: 10px; font-weight: 800; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .stat { background: var(--soft); border-radius: 14px; padding: 12px 14px; }
  .stat b { display: block; font-size: 24px; line-height: 1.15; font-weight: 800; }
  .stat span { color: var(--mut); font-size: 13px; font-weight: 700; }
  .stat.red b { color: var(--bad); }
  .bars div.b { display: grid; grid-template-columns: 130px 1fr 34px; gap: 10px; align-items: center; margin: 7px 0; font-size: 14px; }
  .bars i { display: block; height: 14px; border-radius: 7px; background: linear-gradient(90deg, var(--bar), var(--pri)); min-width: 4px; }
  .cols { display: flex; align-items: flex-end; gap: 7px; height: 140px; margin-top: 12px; }
  .cols > div { flex: 1; text-align: center; font-size: 11.5px; color: var(--mut); display: flex; flex-direction: column; justify-content: flex-end; height: 100%; font-weight: 700; }
  .cols .pair { display: flex; flex-direction: row; align-items: flex-end; gap: 3px; height: 104px; }
  .cols .pair i { flex: 1; }
  .cols i { display: block; background: linear-gradient(180deg, var(--pri), var(--bar)); border-radius: 6px 6px 2px 2px; min-height: 3px; }
  .cols i.prev { background: var(--bar2); }
  .cols b { color: var(--tx); font-size: 12.5px; }
  .legend { font-size: 12.5px; color: var(--mut); display: flex; gap: 14px; margin-top: 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--pri); margin-inline-end: 5px; }
  .legend i.prev { background: var(--bar2); }
  table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  th, td { text-align: start; padding: 10px 8px; border-bottom: 1px solid var(--bd); vertical-align: top; }
  th { color: var(--mut); font-weight: 800; font-size: 12.5px; background: var(--soft); }
  tr:last-child td { border-bottom: 0; }
  .off { opacity: .5; }
  .chip { display: inline-flex; align-items: center; gap: 4px; background: var(--soft); border: 1px solid var(--bd); border-radius: 999px; padding: 3px 10px; margin: 2px; font-size: 13.5px; direction: ltr; }
  .chip button { border: 0; background: transparent; color: var(--bad); padding: 0 2px; font-size: 14px; }
  .pagehd { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .pagehd h2 { margin: 0; font-size: 20px; font-weight: 800; flex: 1; }
</style>
</head>
<body>
<div id="gate" style="display:none">
  <div class="gi">🛠️</div>
  <h2>لوحة الصيانة</h2>
  <p id="gateMsg" style="color:var(--mut)">افتح اللوحة من الرابط الشخصي الذي يرسله لك البوت (زر «🖥️ لوحة الويب»).</p>
</div>

<div id="app" style="display:none">
  <aside class="side">
    <div class="brandrow"><div class="logo">🛠️</div><div class="bt">لوحة الصيانة<small>مكتب عبد الله الجلسي</small></div></div>
    <nav class="nav">
      <button class="tab on" id="tab_req" onclick="setTab('req')"><span class="ico">📋</span><span>الطلبات</span><span class="cnt hidden" id="cntOpen"></span></button>
      <button class="tab" id="tab_vis" onclick="setTab('vis')"><span class="ico">📅</span><span>المواعيد</span></button>
      <button class="tab" id="tab_rat" onclick="setTab('rat')"><span class="ico">⭐</span><span>التقييمات</span></button>
      <button class="tab" id="tab_rep" onclick="setTab('rep')"><span class="ico">📊</span><span>الإحصاءات</span></button>
      <button class="tab" id="tab_team" onclick="setTab('team')"><span class="ico">👥</span><span>الفريق</span></button>
      <button class="tab" id="tab_dir" onclick="setTab('dir')"><span class="ico">🏢</span><span>العمائر</span></button>
      <button class="tab" id="tab_set" onclick="setTab('set')"><span class="ico">⚙️</span><span>الإعدادات</span></button>
    </nav>
    <div class="foot">
      <div class="me" id="me"></div>
      <div class="row2">
        <button class="ib" onclick="load(true)" title="تحديث">🔄</button>
        <button class="ib" onclick="toggleTheme()" title="الوضع">🌓</button>
        <button class="ib" onclick="renewKey()" title="تجديد رابطي الشخصي">🔑</button>
      </div>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <h1 id="ttl">الطلبات</h1>
      <span class="upd" id="upd"></span>
      <div class="mob"><button class="ib" onclick="load(true)">🔄</button><button class="ib" onclick="toggleTheme()">🌓</button><button class="ib" onclick="renewKey()">🔑</button></div>
    </div>

    <div id="vreq" class="page">
      <div class="sumline" id="sumline"></div>
      <div class="chipsbar" id="stats"></div>
      <div class="wrap">
        <div id="list">
          <div class="tools"><input id="q" placeholder="🔎 ابحث: رقم الطلب، اسم، عمارة، شقة، فني…" oninput="draw()"><button class="btn pri" onclick="newReq()" style="margin-inline-start:8px">➕ طلب جديد</button></div>
          <div id="items"></div>
        </div>
        <div id="detail" class="panel"><div class="empty">👈 اختر طلباً من القائمة لعرض تفاصيله</div></div>
      </div>
    </div>

    <div id="vvis" class="page" style="display:none"></div>
    <div id="vrat" class="page" style="display:none"></div>
    <div id="vrep" class="page" style="display:none"></div>
    <div id="vteam" class="page" style="display:none"></div>
    <div id="vdir" class="page" style="display:none"></div>
    <div id="vset" class="page" style="display:none"></div>
  </main>
</div>

<div class="modal" id="modal"><div class="box">
  <h3 id="mTitle" style="margin-top:0;color:var(--tx);font-size:17px"></h3>
  <div id="mBody"></div>
  <div class="row"><button class="btn pri" id="mOk">تأكيد</button><button class="btn" onclick="closeModal()">إلغاء</button></div>
</div></div>
<div class="modal" id="lb" onclick="this.classList.remove('on')"><img id="lbImg" alt=""></div>
<div class="toast" id="toast"></div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycby4tmfamJKcw5g29sgp45Rp6j_jSC_1TB5a28VDDbqjznHfN8aZFDdc8Bn9pcWkLs6u7g/exec';
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const TYPE_LIST = ['سباكة', 'كهرباء', 'مصعد', 'أخرى', 'وايت ماء', 'وايت صرف صحي'];
  const TITLES = { req: 'الطلبات', rat: 'تقييمات الفنيين', vis: 'جدول المواعيد', rep: 'الإحصاءات', team: 'الفريق والحراس', dir: 'العمائر والمستأجرون', set: 'الإعدادات والميزات' };
  let KEY = '', DATA = null, FILTER = 'open', SEL = '', DETAIL = null, busy = false, TAB = 'req', BLDS = null;
  let TEAM = null, GUARDS = null, TENROWS = [];
  const IMG = {};

  try {
    const m = /[#&]k=([a-f0-9]{24,64})/.exec(location.hash);
    if (m) { localStorage.setItem('adm_key', m[1]); history.replaceState(null, '', location.pathname); }
    KEY = localStorage.getItem('adm_key') || '';
  } catch (e) { const m = /[#&]k=([a-f0-9]{24,64})/.exec(location.hash); KEY = m ? m[1] : ''; }
  try { const th = localStorage.getItem('adm_theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
  function toggleTheme() {
    const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const nx = cur === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = nx; try { localStorage.setItem('adm_theme', nx); } catch (e) {}
  }

  async function api(op, id, arg) {
    const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, credentials: 'omit', redirect: 'follow',
      body: JSON.stringify({ fn: 'adminApi', args: [KEY, op, id == null ? '' : id, arg == null ? '' : arg] }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'خطأ');
    return j.result;
  }
  function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2800); }
  // تنفيذ عملية بالخادم مع رسالة نجاح/فشل. يرجع النتيجة أو false
  async function call(op, id, arg, okMsg) {
    try { const r = await api(op, id, arg); if (!r.ok) { toast(r.msg || 'تعذّر'); return false; } if (okMsg !== '') toast(okMsg || '✅ تم'); return r; }
    catch (e) { toast('تعذّر: ' + e.message); return false; }
  }
  const skel = n => Array.from({ length: n }, () => '<div class="skel"></div>').join('');

  async function renewKey() {
    if (!confirm('تجديد رابطك الشخصي؟ الرابط القديم (وأي جهاز آخر فاتحه) يتوقف فوراً، وهذا الجهاز يستمر.')) return;
    const r = await call('newkey', '', '', '✅ تم التجديد — الرابط القديم توقف');
    if (r) { KEY = r.key; try { localStorage.setItem('adm_key', KEY); } catch (e) {} }
  }

  // ---------- نافذة نموذج عامة ----------
  function openForm(title, fields, onOk, okLabel) {
    $('mTitle').textContent = title;
    $('mBody').innerHTML = fields.map((f, i) => {
      const id = 'f_' + i;
      if (f.type === 'select') return `<label for="${id}">${esc(f.label)}</label><select class="inp" id="${id}">${f.opts.map(o => `<option value="${esc(o[0])}" ${String(o[0]) === String(f.v) ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select>`;
      if (f.type === 'textarea') return `<label for="${id}">${esc(f.label)}</label><textarea id="${id}" placeholder="${esc(f.ph || '')}">${esc(f.v || '')}</textarea>`;
      return `<label for="${id}">${esc(f.label)}</label><input class="inp" id="${id}" type="text" ${f.type === 'tel' ? 'inputmode="tel" dir="ltr"' : ''} value="${esc(f.v || '')}" placeholder="${esc(f.ph || '')}">`;
    }).join('');
    $('mOk').textContent = okLabel || 'حفظ';
    $('mOk').onclick = async () => { const vals = fields.map((f, i) => $('f_' + i).value.trim()); closeModal(); await onOk(vals); };
    $('modal').classList.add('on');
    const first = $('f_0'); if (first) first.focus();
  }
  function closeModal() { $('modal').classList.remove('on'); }
  function confirmBox(title, text, onOk, label) {
    $('mTitle').textContent = title; $('mBody').innerHTML = `<div style="padding:6px 0;line-height:1.8">${esc(text)}</div>`;
    $('mOk').textContent = label || 'تأكيد'; $('mOk').onclick = async () => { closeModal(); await onOk(); }; $('modal').classList.add('on');
  }
  async function getBlds() { if (!BLDS) { const r = await call('blds', '', '', ''); if (r) BLDS = r.blds; } return BLDS || []; }

  // ---------- التبويبات ----------
  function setTab(t) {
    TAB = t; $('ttl').textContent = TITLES[t];
    ['req', 'vis', 'rat', 'rep', 'team', 'dir', 'set'].forEach(k => { $('tab_' + k).classList.toggle('on', k === t); $('v' + k).style.display = k === t ? '' : 'none'; });
    window.scrollTo({ top: 0 });
    if (t === 'rep') loadReport(); if (t === 'team') loadTeam(); if (t === 'dir') loadDir(); if (t === 'set') loadSet(); if (t === 'vis') drawVisits(); if (t === 'rat') loadRatings();
  }
  // ---------- تقييمات الفنيين ----------
  async function loadRatings() {
    const v = $('vrat'); v.innerHTML = skel(3);
    const r = await call('ratings', '', '', ''); if (!r) { v.innerHTML = '<div class="empty">تعذّر التحميل</div>'; return; }
    const stars = n => '★'.repeat(n) + '☆'.repeat(5 - n), by = {};
    r.list.filter(x => x.st === 'معتمد').forEach(x => { (by[x.tech] = by[x.tech] || []).push(x.stars); });
    const avg = Object.keys(by).map(k => `<span class="chip"><b>${esc(k)}</b> ${(by[k].reduce((a, b) => a + b, 0) / by[k].length).toFixed(1)} / 5 (${by[k].length})</span>`).join(' ');
    const badge = s => s === 'معتمد' ? '<span class="badge b-تمت">يظهر للأعضاء</span>' : s === 'مرفوض' ? '<span class="badge b-مرفوض">مخفي</span>' : '<span class="badge b-بانتظار">بانتظار قرارك</span>';
    v.innerHTML = `<div class="panel"><b>⭐ التقييمات والشكاوى</b><div class="hint" style="margin:6px 0 10px">${r.owner ? 'أنت تقرّر أي تقييم يظهر للأعضاء (الأدمن والفني المعني).' : 'التقييمات المعتمدة من المالك فقط.'}</div>${avg ? '<div class="row" style="margin:0 0 10px">' + avg + '</div>' : ''}
      <table><tr><th>التقييم</th><th>الفني</th><th>الطلب</th><th>الملاحظة</th>${r.owner ? '<th>القرار</th>' : ''}</tr>
      ${r.list.map(x => `<tr><td style="white-space:nowrap;color:#e0a800">${stars(x.stars)}<br><small style="color:var(--mut)">${esc(x.date)}</small></td><td>👷 ${esc(x.tech)}</td><td><a href="#" onclick="goReq('${esc(x.id)}');return false">#${esc(x.id)}</a></td><td>${esc(x.note) || '—'}</td>${r.owner ? `<td style="white-space:nowrap">${badge(x.st)}<div class="row" style="margin:6px 0 0"><button class="btn sm ok" onclick="rateRev(${x.row},'y')">✅ يظهر</button><button class="btn sm" onclick="rateRev(${x.row},'n')">🚫 يخفى</button></div></td>` : ''}</tr>`).join('') || '<tr><td colspan="5">لا توجد تقييمات</td></tr>'}</table></div>`;
  }
  async function rateRev(row, yn) { if (await call('raterev', row, yn, yn === 'y' ? '✅ سيظهر للأعضاء' : '🚫 سيبقى مخفياً')) loadRatings(); }

  // ---------- جدول المواعيد ----------
  function drawVisits() {
    const v = $('vvis'); if (!DATA) { v.innerHTML = skel(4); return; }
    const today = new Date(Date.now() + 3 * 3600000).toISOString().slice(0, 10);
    const per = r => r.vis.includes('صباحاً') ? 0 : 1;
    const all = DATA.reqs.filter(r => r.vis && r.vdate).sort((a, b) => String(a.vdate).localeCompare(String(b.vdate)) || per(a) - per(b));
    const late = all.filter(r => !isDone(r.st) && r.vdate < today), up = all.filter(r => !isDone(r.st) && r.vdate >= today), past = all.filter(r => isDone(r.st)).reverse();
    const fmt = r => { const d = String(r.vdate).split('-'); const w = r.vis.split(' '); return esc(w[0]) + (d.length === 3 ? ' ' + Number(d[2]) + '/' + Number(d[1]) : '') + ' ' + esc(w.slice(1).join(' ')); };
    const tbl = (list, empty, warn) => `<table><tr><th>الموعد</th><th>المكان</th><th>المستأجر</th><th>الفني</th><th>الحالة</th></tr>${list.map(r => `<tr style="cursor:pointer;${warn ? 'background:rgba(220,60,60,.10)' : r.vdate === today ? 'background:var(--soft)' : ''}" onclick="goReq('${esc(r.id)}')"><td><b>${fmt(r)}</b>${r.vdate === today ? '<br><small>اليوم</small>' : warn ? '<br><small>⚠️ فات</small>' : ''}</td><td>#${esc(r.id)} · ${esc(place(r))}<br><small style="color:var(--mut)">${esc(r.type)}</small></td><td>${esc(r.tenant || r.name)}</td><td>${r.tech ? '👷 ' + esc(r.tech) : '—'}</td><td><span class="badge ${bcls(r.st)}">${esc(r.st)}</span></td></tr>`).join('') || '<tr><td colspan="5">' + empty + '</td></tr>'}</table>`;
    v.innerHTML = (late.length ? `<div class="panel" style="border:2px solid var(--bad)"><b>⚠️ فات موعدها ولم تُغلق (${late.length})</b><div class="hint">افتح الطلب من تليجرام: إعادة جدولة، أو إرجاع للانتظار، أو إغلاق</div>${tbl(late, '', true)}</div>` : '')
      + `<div class="panel" style="margin-top:16px"><b>📅 المواعيد القادمة (${up.length})</b>${tbl(up, 'لا توجد مواعيد قادمة')}</div>
      <div class="panel" style="margin-top:16px"><b>✅ مغلقة</b>${tbl(past, 'لا شيء')}</div>`;
  }

  // ---------- الطلبات ----------
  async function load(manual) {
    if (!KEY) { $('gate').style.display = 'block'; return; }
    if (busy) return; busy = true;
    try {
      const r = await api('list');
      if (!r.ok) { $('app').style.display = 'none'; $('gate').style.display = 'block'; $('gateMsg').textContent = r.msg || 'الرابط غير صالح'; return; }
      DATA = r; $('gate').style.display = 'none'; $('app').style.display = 'block';
      ['team', 'dir', 'set'].forEach(k => $('tab_' + k).classList.toggle('hidden', !r.owner));   // الفريق والعمائر للمالك فقط
      if (!r.owner && (TAB === 'team' || TAB === 'dir' || TAB === 'set')) setTab('req');
      $('me').textContent = '👤 ' + r.me; $('upd').textContent = 'آخر تحديث ' + r.at.slice(11);
      draw(); if (TAB === 'vis') drawVisits();
      if (SEL && (manual || DETAIL)) openReq(SEL, true);
      if (manual && TAB === 'rep') loadReport(); if (manual && TAB === 'team') loadTeam(); if (manual && TAB === 'dir') loadDir();
    } catch (e) { if (manual) toast('تعذّر التحميل: ' + e.message); }
    finally { busy = false; }
  }

  const isDone = s => s === 'تمت المعالجة' || s === 'مرفوض';
  const bcls = s => 'b-' + String(s).split(' ')[0];
  const scls = s => 's-' + String(s).split(' ')[0];
  function age(ts) {
    const d = new Date(String(ts).replace(' ', 'T') + ':00+03:00'); if (isNaN(d)) return '';
    const m = Math.floor((Date.now() - d) / 60000);
    return m < 60 ? 'قبل ' + Math.max(m, 1) + ' د' : m < 1440 ? 'قبل ' + Math.floor(m / 60) + ' س' : 'قبل ' + Math.floor(m / 1440) + ' يوم';
  }
  const hfmt = h => h >= 48 ? Math.floor(h / 24) + ' يوم' : h + ' ساعة';
  const place = r => r.bld ? r.bld + ' — ' + r.apt : (r.dis ? 'حي ' + r.dis + ' — ' : '') + r.apt;

  const FILTERS = [
    ['open', 'مفتوحة', r => !isDone(r.st)], ['new', 'جديدة', r => r.st === 'جديد'], ['wip', 'قيد المعالجة', r => r.st === 'قيد المعالجة'],
    ['wait', 'بانتظار تأكيدك', r => r.st === 'أنجزه الفني'], ['ask', 'بانتظار المستأجر', r => r.st === 'بانتظار المستأجر'],
    ['urg', '🔴 عاجلة', r => r.urg && !isDone(r.st)], ['closed', 'مغلقة', r => isDone(r.st)], ['all', 'الكل', () => true],
  ];
  const cnt = k => DATA.reqs.filter(FILTERS.find(f => f[0] === k)[2]).length;
  function draw() {
    if (!DATA) return;
    const nOpen = cnt('open'), nNew = cnt('new'), nWait = cnt('wait'), nUrg = cnt('urg');
    $('sumline').innerHTML = `
      <div class="kpi" style="--c:var(--pri)"><b>${nOpen}</b><span>طلب مفتوح</span></div>
      <div class="kpi" style="--c:var(--new)"><b>${nNew}</b><span>جديد بلا معالجة</span></div>
      <div class="kpi" style="--c:var(--wait)"><b>${nWait}</b><span>بانتظار تأكيدك</span></div>
      <div class="kpi ${nUrg ? 'red' : ''}" style="--c:var(--bad)"><b>${nUrg}</b><span>عاجل</span></div>`;
    const c = $('cntOpen'); c.textContent = nOpen; c.classList.toggle('hidden', !nOpen);
    $('stats').innerHTML = FILTERS.map(f => {
      const n = cnt(f[0]);
      return `<button class="fchip ${FILTER === f[0] ? 'on' : ''} ${f[0] === 'urg' && n ? 'red' : ''}" onclick="setFilter('${f[0]}')">${f[1]} <b>${n}</b></button>`;
    }).join('');
    const q = $('q').value.trim().toLowerCase(), f = FILTERS.find(x => x[0] === FILTER)[2];
    let list = DATA.reqs.filter(f);
    if (q) list = list.filter(r => [r.id, r.name, r.bld, r.apt, r.tenant, r.tech, r.type, r.phone, r.desc].join(' ').toLowerCase().includes(q));
    if (FILTER !== 'closed' && FILTER !== 'all') list = list.slice().sort((a, b) => (b.urg - a.urg) || (Number(a.id) - Number(b.id)));
    $('items').innerHTML = list.length ? list.map(r => `
      <div class="item ${scls(r.st)} ${SEL === r.id ? 'sel' : ''}" onclick="openReq('${esc(r.id)}')">
        <div class="av">${esc(r.icon)}</div>
        <div class="t">#${esc(r.id)} · ${esc(place(r))} ${r.urg ? '<span class="urg">🔴</span>' : ''}</div>
        <div class="s">${esc(r.type)} · ${esc(r.tenant || r.name)}</div>
        <div class="m"><span class="badge ${bcls(r.st)}">${esc(r.st)}</span>${r.tech ? '<span class="s">👷 ' + esc(r.tech) + '</span>' : ''}${r.media ? '<span class="s">📎 ' + r.media + '</span>' : ''}</div>
        <div class="r">${esc(age(r.ts))}</div>
      </div>`).join('') : '<div class="empty">🎉 لا توجد طلبات هنا</div>';
  }
  function setFilter(f) { FILTER = f; draw(); }

  async function openReq(id, quiet) {
    SEL = id; draw(); document.body.classList.add('showd');
    if (!quiet) $('detail').innerHTML = '<div style="padding:18px">' + skel(4) + '</div>';
    try {
      const r = await api('detail', id);
      if (!r.ok) { $('detail').innerHTML = '<div class="empty">' + esc(r.msg) + '</div>'; return; }
      DETAIL = r; drawDetail(); loadThumbs();
    } catch (e) { $('detail').innerHTML = '<div class="empty">تعذّر التحميل</div>'; }
  }
  function closeDetail() { document.body.classList.remove('showd'); }

  async function loadThumbs() {
    const id = DETAIL.req.id, files = DETAIL.req.files || [];
    for (const fid of files) {
      const slot = document.querySelector(`[data-fid="${fid}"]`); if (!slot) continue;
      try {
        if (!IMG[fid]) { const r = await api('media', id, fid); if (r.ok) IMG[fid] = 'data:' + r.mime + ';base64,' + r.b64; else { slot.textContent = '🎞️ فتح'; slot.dataset.nofile = '1'; continue; } }
        if (DETAIL.req.id !== id) return;
        slot.innerHTML = `<img src="${IMG[fid]}" alt="">`; slot.dataset.img = fid;
      } catch (e) { slot.textContent = '📎 فتح'; slot.dataset.nofile = '1'; }
    }
  }
  function openThumb(i) {
    const slot = document.querySelector(`[data-fid="${DETAIL.req.files[i]}"]`), fid = DETAIL.req.files[i];
    if (slot && slot.dataset.img && IMG[fid]) { $('lbImg').src = IMG[fid]; $('lb').classList.add('on'); }
    else window.open(DETAIL.req.links[i] || DETAIL.req.after, '_blank', 'noopener');
  }

  function drawDetail() {
    const r = DETAIL.req, done = isDone(r.st);
    const wa = r.waPhone ? `<a class="btn ok" target="_blank" rel="noopener" href="https://wa.me/${esc(r.waPhone)}">💬 واتساب</a><a class="btn" href="tel:+${esc(r.waPhone)}">📞 اتصال</a>` : '';
    const techOpts = '<option value="">— اختر الفني —</option>' + DATA.techs.map(t => `<option value="${esc(t.row)}">${esc(t.name)}${t.spec ? ' — ' + esc(t.spec) : ''}</option>`).join('');
    const files = r.files || [];
    $('detail').innerHTML = `
      <button class="btn back" onclick="closeDetail()">→ رجوع للقائمة</button>
      <div class="dh">
        <h2>${esc(r.icon)} طلب #${esc(r.id)} ${r.urg ? '<span class="urg">🔴 عاجل</span>' : ''}</h2>
        <span class="badge ${bcls(r.st)}">${esc(r.st)}</span> ${r.ts2 ? '<span class="badge b-قيد">' + esc(r.ts2) + '</span>' : ''} <span style="color:var(--mut);font-size:13.5px;margin-inline-start:6px">${esc(r.ts)}</span>
      </div>
      <div class="db">
      <div class="kv">
        <div>النوع</div><div>${esc(r.type)}</div>
        <div>المكان</div><div><b>${esc(place(r))}</b></div>
        <div>المبلّغ</div><div>${esc(r.name)}</div>
        <div>المستأجر</div><div>${esc(r.tenant || '—')} <small style="color:var(--mut)">${esc(r.match)}</small></div>
        <div>الجوال</div><div dir="ltr" style="text-align:end">${esc(r.phone || '—')}</div>
        <div>الفني</div><div>${r.tech ? '👷 ' + esc(r.tech) : '—'}</div>
        ${r.src ? `<div>المصدر</div><div>⬆️ شقة ${esc(r.src)}</div>` : ''}
      </div>
      <div class="desc">${esc(r.fullDesc) || '—'}</div>
      ${r.question ? `<h3>❓ سؤال الإدارة</h3><div class="desc">${esc(r.question)}${r.reply ? '<hr style="border:0;border-top:1px solid var(--bd)">💬 ' + esc(r.reply) : ''}</div>` : ''}
      ${r.note ? `<h3>🗒 ملاحظة الإغلاق</h3><div class="desc">${esc(r.note)}</div>` : ''}${r.reason ? `<h3>🚫 سبب الرفض</h3><div class="desc">${esc(r.reason)}</div>` : ''}
      ${r.links.length || r.after ? `<h3>📎 المرفقات</h3>
        <div class="thumbs">${files.map((f, i) => `<div class="th" data-fid="${esc(f)}" onclick="openThumb(${i})">⏳</div>`).join('')}</div>
        <div class="row">${r.links.map((u, i) => `<a class="btn sm" target="_blank" rel="noopener" href="${esc(u)}">فتح مرفق ${i + 1} في Drive</a>`).join('')}${r.after ? `<a class="btn sm" target="_blank" rel="noopener" href="${esc(r.after)}">✅ صورة بعد الإصلاح</a>` : ''}</div>` : ''}
      <div class="row">${wa}</div>
      ${r.vis ? `<h3>📅 موعد الزيارة</h3><div class="desc"><b>${esc(r.vis)}${r.vdate ? ' — ' + esc(r.vdate) : ''}</b></div>` : ''}
      <h3>إجراءات</h3>
      ${done ? `<div class="row"><button class="btn pri" onclick="act('reopen')">♻️ إعادة فتح</button></div>` : `
        <div class="row">
          <select id="techSel" style="flex:1;min-width:150px">${techOpts}</select>
          <button class="btn pri" onclick="assign()">👷 ${r.tech ? 'تغيير الفني' : 'تعيين'}</button>
        </div>
        <div class="row">
          ${r.st === 'جديد' ? '<button class="btn" onclick="act(\'wip\')">⏳ قيد المعالجة</button>' : ''}
          ${r.st === 'أنجزه الفني' ? '<button class="btn ok" onclick="ask2(\'close\',\'✅ تأكيد الإغلاق\',\'ملاحظة الإغلاق (اختياري)\',true)">✅ تأكيد الإغلاق</button><button class="btn" onclick="act(\'back\')">↩️ إرجاع للفني</button>' : '<button class="btn ok" onclick="ask2(\'close\',\'✅ إغلاق الطلب\',\'ملاحظة الإغلاق (اختياري)\',true)">✅ إغلاق</button>'}
          <button class="btn" onclick="act('urgent')">${r.urg ? '⚪ اجعله عادي' : '🔴 اجعله عاجل'}</button>
        </div>
        <div class="row"><button class="btn pri" onclick="visitForm()">📅 ${r.vis ? 'إعادة جدولة' : 'تحديد موعد زيارة'}</button>${r.vis ? '<button class="btn" onclick="visitWait()">⏸ إرجاع للانتظار</button>' : ''}</div>
        <div class="row">

  let REP_DAYS = 30, REP = null;
  async function loadReport(days) {
    if (days != null) REP_DAYS = days;
    const v = $('vrep'); v.innerHTML = skel(5);
    try {
      const s = await api('stats', REP_DAYS);
      if (!s.ok) { v.innerHTML = '<div class="empty">' + esc(s.msg || 'تعذّر') + '</div>'; return; }
      REP = s; drawReport();

  }
  function drawReport() {
    const s = REP, v = $('vrep');
    const max = a => Math.max(1, ...a.map(x => x.n));
    const bars = a => `<div class="bars">${a.map(x => `<div class="b"><span>${esc(x.k)}</span><i style="width:${Math.round(100 * x.n / max(a))}%"></i><b>${x.n}</b></div>`).join('') || '—'}</div>`;
    const w = s.week, wmax = Math.max(1, ...w.byDay.map(x => x.n), ...w.prevByDay.map(x => x.n));
    const dmax = Math.max(1, ...s.daily.map(x => x.n)), wk = Math.max(1, ...s.weeks.map(x => x.n)), dw = Math.max(1, ...s.dow.map(x => x.n));
    const diff = w.total - w.last, arrow = diff > 0 ? '▲ ' + diff : diff < 0 ? '▼ ' + Math.abs(diff) : '＝';
    v.innerHTML = `
      <div class="panel" style="border:2px solid var(--pri)">
        <b>📅 هذا الأسبوع (الأحد ← السبت) · ${esc(w.start)} إلى ${esc(w.end)}</b>
        <div class="stats">
          <div class="stat"><b>${w.total}</b><span>طلبات هذا الأسبوع</span></div>
          <div class="stat"><b>${w.last}</b><span>الأسبوع الماضي (${arrow})</span></div>
          <div class="stat"><b>${w.closed}</b><span>أُنجز هذا الأسبوع</span></div>
          <div class="stat ${w.urgent ? 'red' : ''}"><b>${w.urgent}</b><span>عاجلة هذا الأسبوع</span></div>
        </div>
        <div class="cols">${w.byDay.map((d, i) => `<div><div class="pair"><i style="height:${Math.round(100 * d.n / wmax)}px"></i><i class="prev" style="height:${Math.round(100 * w.prevByDay[i].n / wmax)}px"></i></div><b>${d.n}</b>${esc(d.d)}</div>`).join('')}</div>
        <div class="legend"><span><i></i>هذا الأسبوع</span><span><i class="prev"></i>الأسبوع الماضي</span></div>
      </div>
      <div class="chipsbar" style="margin-top:16px;align-items:center"><b style="flex:none">الفترة:</b>
        ${[[7, '٧ أيام'], [30, '٣٠ يوماً'], [90, '٩٠ يوماً'], [0, 'الكل']].map(p => `<button class="fchip ${REP_DAYS === p[0] ? 'on' : ''}" onclick="loadReport(${p[0]})">${p[1]}</button>`).join('')}</div>
      <div class="stats">
        <div class="stat"><b>${s.total}</b><span>إجمالي البلاغات</span></div>
        <div class="stat"><b>${s.openAll}</b><span>مفتوحة الآن</span></div>
        <div class="stat ${s.overdue3 ? 'red' : ''}"><b>${s.overdue3}</b><span>متأخرة ٣ أيام فأكثر</span></div>
        <div class="stat"><b>${s.closed}</b><span>مغلقة</span></div>
        <div class="stat"><b>${s.rejected}</b><span>مرفوضة</span></div>
        <div class="stat ${s.urgent ? 'red' : ''}"><b>${s.urgent}</b><span>عاجلة</span></div>
        <div class="stat"><b>${s.avgAssign ? hfmt(s.avgAssign) : '—'}</b><span>متوسط وقت التعيين</span></div>
        <div class="stat"><b>${s.avgClose ? hfmt(s.avgClose) : '—'}</b><span>متوسط زمن الإغلاق</span></div>
      </div>
      <div class="grid2">
        <div class="panel"><b>⏳ الأكثر تأخيراً (مفتوحة)</b>
          <table><tr><th>الطلب</th><th>المكان</th><th>الحالة</th><th>منذ</th></tr>
          ${s.delayed.map(d => `<tr style="cursor:pointer" onclick="goReq('${esc(d.id)}')"><td>#${esc(d.id)} ${d.urg ? '🔴' : ''}</td><td>${esc(d.place)}<br><small style="color:var(--mut)">${esc(d.type)}${d.tech ? ' · 👷 ' + esc(d.tech) : ''}</small></td><td><span class="badge ${bcls(d.st)}">${esc(d.st)}</span></td><td><b>${hfmt(d.h)}</b></td></tr>`).join('') || '<tr><td colspan="4">لا توجد طلبات مفتوحة 🎉</td></tr>'}</table></div>
        <div class="panel"><b>🏠 عدد الطلبات لكل شقة</b>
          <input class="inp" id="aptQ" placeholder="🔎 ابحث بعمارة أو رقم شقة…" oninput="drawApts()" style="width:100%;margin:0 0 8px">
          <div id="aptBox" style="max-height:340px;overflow:auto"></div></div>
        <div class="panel"><b>آخر ٨ أسابيع</b><div class="cols">${s.weeks.map(d => `<div><i style="height:${Math.round(100 * d.n / wk)}px"></i><b>${d.n}</b>${esc(d.w)}</div>`).join('')}</div></div>
        <div class="panel"><b>آخر ١٤ يوماً</b><div class="cols">${s.daily.map(d => `<div><i style="height:${Math.round(100 * d.n / dmax)}px"></i><b>${d.n}</b>${esc(d.d.slice(3))}</div>`).join('')}</div></div>
        <div class="panel"><b>حسب يوم الأسبوع</b><div class="cols">${s.dow.map(d => `<div><i style="height:${Math.round(100 * d.n / dw)}px"></i><b>${d.n}</b>${esc(d.d)}</div>`).join('')}</div></div>

        <div class="panel"><b>حسب الحالة</b>${bars(s.byStatus)}</div>
        <div class="panel"><b>مصدر البلاغ</b>${bars(s.bySource)}</div>
      </div>
      <div class="panel" style="margin-top:16px"><b>👷 أداء الفنيين</b>
        <table><tr><th>الفني</th><th>الطلبات</th><th>المنجز</th><th>متوسط الإنجاز</th></tr>
        ${s.techs.map(t => `<tr><td>${esc(t.name)}</td><td>${t.total}</td><td>${t.done}</td><td>${t.avgH ? hfmt(t.avgH) : '—'}</td></tr>`).join('') || '<tr><td colspan="4">—</td></tr>'}</table></div>`;
    drawApts();
  }

        <table><tr><th>العمارة</th><th>الوحدات</th><th>رابط الموقع</th><th>الصورة</th></tr>
        ${blds.map((b, i) => `<tr><td><b>${esc(b.name)}</b></td><td>${b.units}</td><td><div class="row" style="margin:0;flex-wrap:nowrap"><input class="inp" id="mp${i}" style="width:100%;min-width:150px;padding:6px 8px" dir="ltr" placeholder="https://maps.app.goo.gl/…" value="${esc(b.url)}" onkeydown="if(event.key==='Enter')saveMap(${i}, this.value)"><button class="btn sm pri" onclick="saveMap(${i}, $('mp${i}').value)">💾 حفظ</button></div></td>
          <td style="white-space:nowrap"><input type="file" id="bf${i}" accept="image/*" class="hidden" onchange="uploadBld(${i})">${b.photo ? `<span id="bt${i}" onclick="viewBld(${i})" style="display:inline-block;width:64px;height:64px;border-radius:10px;background:var(--soft);vertical-align:middle;margin-inline-end:6px;overflow:hidden;cursor:zoom-in;text-align:center;line-height:64px">⏳</span>` : ''}<button class="btn sm" onclick="$('bf${i}').click()">${b.photo ? '🔁 تغيير' : '📷 رفع'}</button>${b.photo ? ' <button class="btn sm" onclick="delBld(' + i + ')">🗑️</button>' : ''}</td></tr>`).join('')}</table></div>
      <div class="panel"><b>🔎 المستأجرون وأرقامهم</b>
        <div class="row" style="margin-top:0"><input class="inp" id="tq" placeholder="اسم، عمارة، شقة أو جوال…" style="flex:1" onkeydown="if(event.key==='Enter')searchTen()"><button class="btn pri" onclick="searchTen()">بحث</button></div>
        <div style="color:var(--mut);font-size:13px">الأرقام المضافة هنا تبقى بعد كل مزامنة. الرقم الأساسي من مصدر البيانات لا يُحذف من هنا.</div>
        <div id="tenBox" style="margin-top:10px"></div></div></div>`;
    loadBThumbs();
  }
  const BIMG = {};
  async function bldImg(i) {
    const n = BLDS[i].name; if (BIMG[n]) return BIMG[n];
    const r = await call('bphoto', n, '', ''); if (!r) return '';
    return (BIMG[n] = 'data:' + r.mime + ';base64,' + r.b64);
  }
  async function loadBThumbs() {
    for (let i = 0; i < BLDS.length; i++) {
      if (!BLDS[i].photo) continue;
      const el = $('bt' + i); if (!el) continue;
      try { const u = await bldImg(i); if (u && $('bt' + i)) $('bt' + i).innerHTML = `<img src="${u}" alt="" style="width:100%;height:100%;object-fit:cover">`; else if (el) el.textContent = '🖼️'; } catch (e) { el.textContent = '🖼️'; }
    }
  }
  async function viewBld(i) { const u = await bldImg(i); if (u) { $('lbImg').src = u; $('lb').classList.add('on'); } }
  async function saveMap(i, url) { const b = BLDS[i]; if (await call('setmap', b.name, url.trim(), '✅ حُفظ رابط الموقع')) b.url = url.trim(); }
  async function compressImg(file) {
    const url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
    return c.toDataURL('image/jpeg', 0.75).split(',')[1];
  }
  async function uploadBld(i) {
    const f = $('bf' + i).files[0]; if (!f) return;
    toast('⏳ جاري الرفع…');
    try { const b64 = await compressImg(f); if (await call('setbphoto', BLDS[i].name, b64, '✅ حُفظت صورة العمارة')) loadDir(); }
    catch (e) { toast('تعذّر رفع الصورة'); }
  }
  function delBld(i) { confirmBox('🗑️ حذف الصورة', 'حذف صورة ' + BLDS[i].name + '؟', async () => { if (await call('setbphoto', BLDS[i].name, '', '🗑️ حُذفت الصورة')) loadDir(); }, 'حذف'); }
  async function loadSet() {
    const v = $('vset'); v.innerHTML = skel(3);
    const r = await call('feat', '', '', ''); if (!r) { v.innerHTML = '<div class="empty">تعذّر التحميل</div>'; return; }
    v.innerHTML = `<div class="panel"><b>🎛️ الميزات</b><div class="hint" style="margin:6px 0 10px">فعّل أو ألغِ أي ميزة. الإلغاء يوقفها فوراً بدون حذف شيء.</div>
      ${r.feats.map(f => `<label style="display:flex;align-items:center;gap:10px;padding:12px 4px;border-top:1px solid var(--bd);cursor:pointer"><input type="checkbox" ${f.on ? 'checked' : ''} onchange="toggleFeat('${f.key}', this)" style="width:20px;height:20px"><span style="font-weight:700">${esc(f.label)}</span></label>`).join('')}</div>`;
  }
  async function toggleFeat(k, el) { const want = el.checked; if (!(await call('setfeat', k, want ? 'on' : 'off', want ? '✅ فُعّلت' : '⛔ أُلغيت'))) el.checked = !want; }
  async function searchTen() {
    const q = $('tq').value.trim(); if (!q) { toast('اكتب كلمة البحث'); return; }
    const r = await call('tenants', q, '', ''); if (!r) return;
    TENROWS = r.rows; drawTen(r.total);
  }
  function drawTen(total) {
    $('tenBox').innerHTML = `<div style="color:var(--mut);font-size:13px">${total} نتيجة${total > TENROWS.length ? ' (أول ' + TENROWS.length + ')' : ''}</div>
      <table>${TENROWS.map((t, i) => `<tr><td><b>${esc(t.name)}</b><br><small style="color:var(--mut)">${esc(t.bld)} — شقة ${esc(t.apt)} · ${esc(t.src)}</small></td>
        <td><span class="chip">${esc(t.phone || '—')}</span>${String(t.more).split(/\s+/).filter(Boolean).map(p => `<span class="chip">${esc(p)}<button title="حذف" onclick="delPhone(${i}, '${esc(p)}')">✕</button></span>`).join('')}
          <button class="btn sm" onclick="addPhone(${i})">➕ رقم</button></td></tr>`).join('') || '<tr><td>لا نتائج</td></tr>'}</table>`;
  }
  function addPhone(i) {
    const t = TENROWS[i];
    openForm('➕ رقم جديد لـ ' + t.name, [{ label: 'الجوال', type: 'tel', v: '', ph: '05xxxxxxxx' }], async v => { if (await call('addphone', t.row, v[0], '✅ أُضيف الرقم')) searchTen(); });
  }
  function delPhone(i, p) {
    const t = TENROWS[i];
    confirmBox('🗑️ حذف رقم', 'حذف ' + p + ' من ' + t.name + '؟', async () => { if (await call('delphone', t.row, p, '🗑️ حُذف الرقم')) searchTen(); }, 'حذف');
  }

  $('items').innerHTML = skel(5);
  load(true); setInterval(() => { if (!document.hidden && TAB === 'req' && !$('modal').classList.contains('on')) load(false); }, 30000);
</script>
</body>
</html>
